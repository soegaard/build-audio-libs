name: create draft release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Bundle release version, for example 1.0.0
        required: true
        type: string
      source_ref:
        description: Commit SHA, tag, or branch to resolve once for this release
        required: true
        type: string

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-22.04
    outputs:
      commit: ${{ steps.commit.outputs.commit }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.source_ref }}
          fetch-depth: 0
          persist-credentials: false
      - id: commit
        env:
          VERSION: ${{ inputs.version }}
        run: |
          python3 - "$VERSION" <<'PY'
          import re, sys
          if not re.fullmatch(r"[0-9]+(?:[.][0-9A-Za-z-]+){1,3}", sys.argv[1]):
              raise SystemExit("invalid release version")
          PY
          echo "commit=$(git rev-parse --verify HEAD^{commit})" >> "$GITHUB_OUTPUT"

  build:
    needs: resolve
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-macosx
            runner: macos-26
          - target: x86_64-linux
            runner: ubuntu-22.04
          - target: aarch64-linux
            runner: ubuntu-22.04-arm
          - target: x86_64-win32
            runner: windows-2022
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.resolve.outputs.commit }}
          persist-credentials: false
      - name: Set up MSYS2 UCRT64 build tools
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2.32.0
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-toolchain mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-python mingw-w64-ucrt-x86_64-nasm
            make autoconf automake libtool patch git
      - name: Install Unix build tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes autoconf automake libtool make cmake ninja-build pkg-config patchelf libasound2-dev nasm
      - name: Rebuild exact revision
        if: runner.os != 'Windows'
        run: python3 scripts/audio_build.py all --target '${{ matrix.target }}' --version '${{ inputs.version }}' --clean
      - name: Rebuild exact revision
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: python scripts/audio_build.py all --target '${{ matrix.target }}' --version '${{ inputs.version }}' --clean
      - name: Upload validated release bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-${{ matrix.target }}
          path: |
            dist/*-${{ matrix.target }}-${{ inputs.version }}.*
            reports/${{ matrix.target }}/
            .work/stage/${{ matrix.target }}/
          if-no-files-found: error

  draft:
    needs: [resolve, build]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.resolve.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: release-input
          pattern: release-*
          merge-multiple: false
      - name: Refuse an existing release tag or release
        env:
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$VERSION"
          if git ls-remote --exit-code --refs origin "refs/tags/$tag"; then
            echo "tag already exists: $tag" >&2
            exit 1
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "release already exists: $tag" >&2
            exit 1
          fi
      - name: Create checksums and source bundle
        env:
          VERSION: ${{ inputs.version }}
          COMMIT: ${{ needs.resolve.outputs.commit }}
        run: |
          mkdir -p release-output
          find release-input -type f -name 'racket-audio-native-libs-*' -exec cp {} release-output/ \;
          git archive --format=tar.gz --prefix="build-audio-libs-$VERSION/" "$COMMIT" > "release-output/build-audio-libs-$VERSION-source.tar.gz"
          (cd release-output && sha256sum * > SHA256SUMS)
      - name: Create an unpublished draft release
        env:
          VERSION: ${{ inputs.version }}
          COMMIT: ${{ needs.resolve.outputs.commit }}
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$VERSION" release-output/* \
            --draft --target "$COMMIT" --title "racket-audio native libraries $VERSION" \
            --notes "Validated source build for commit $COMMIT. Review this draft and publish it manually."
